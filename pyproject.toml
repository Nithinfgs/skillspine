[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skillspine"
version = "0.1.0"
description = "Dependency maps, change impact, and isolated-install checks for agent skill collections."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nithinfgs"}]
keywords = ["agent-skills", "developer-tools", "dependency-graph", "cli"]
dependencies = ["markdown-it-py>=3.0,<5"]

[project.urls]
Homepage = "https://github.com/Nithinfgs/skillspine"
Issues = "https://github.com/Nithinfgs/skillspine/issues"

[project.scripts]
skillspine = "skillspine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "build>=1.2,<2", "pip-audit>=2.9,<3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
